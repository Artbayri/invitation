<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding of Arin & Dito</title>

  <!-- Google Fonts: Gabarito, Lato, & Cinzel Decorative -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Gabarito:wght@600&family=Lato:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
        1. DEKLARASI FONT CUSTOM
        ========================================================= */
    @font-face {
      font-family: 'BarokahSignature';
      src: url('font/font/BarokahSignatureRegular-PK15Z.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Sansilk';
      src: url('font/font/Sansilk-p71dD.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Foglihtenno07';
      src: url('font/font/Foglihtenno07calt-WpzEA.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    /* =========================================================
        2. RESET & STYLES DASAR
        ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #111111;
      font-family: 'Lato', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .mobile-container {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
    }

    /* Animasi Transisi Fade Cover */
    .fade-in {
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    .fade-out {
      animation: fadeOut 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.02); visibility: hidden; }
    }

    /* =========================================================
        3. STYLES SECTION 1: SAMPUL / COVER
        ========================================================= */
    #section-cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
                  url('background/pic05.jpg') center/cover no-repeat;
    }

    .cover-content {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .text-the-wedding {
      font-family: 'BarokahSignature', cursive, sans-serif;
      color: #ffffff;
      font-size: 14px; 
      letter-spacing: 1px;
      white-space: nowrap;
      margin-bottom: 8px;
    }

    .text-mempelai {
      font-family: 'Gabarito', sans-serif;
      font-weight: 600;
      font-size: 35px; 
      letter-spacing: 1px;
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 50%, #9e9e9e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 70px;
    }

    .text-kepada {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      color: #ffffff;
      font-size: 11px; 
      white-space: nowrap;
      margin-bottom: 6px;
    }

    .text-tamu {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      color: #ffffff;
      font-size: 14px; 
      white-space: nowrap;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .text-maaf {
      font-family: 'Lato', sans-serif;
      font-style: italic;
      color: #ffffff;
      font-size: 9px; 
      white-space: nowrap;
      opacity: 0.9;
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      color: #ffffff;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      outline: none;
      margin-top: 120px;
      background: linear-gradient(270deg, #4a4a4a, #8a8a8a, #2c2c2c, #707070);
      background-size: 300% 300%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-open:active {
      transform: scale(0.95);
    }

    .btn-open:hover {
      animation: gradientMove 0.6s ease infinite;
    }

    .leaf-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* =========================================================
        4. CONTAINER MAIN CONTENT & BACKGROUND SLIDER FIXED
        ========================================================= */
    #main-content {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* SLIDER BACKGROUND TETAP (FIXED) DI BELAKANG */
    .bg-slider-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-slider-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4); /* Gelap sedikit agar kontras teks putih */
      z-index: 2;
    }

    .bg-slider-track {
      display: flex;
      width: 400vw;
      height: 100%;
      animation: slideLoop 28s linear infinite;
    }

    .bg-slide {
      width: 100vw;
      height: 100%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .bg-slide-1 { background-image: url('background/pic05-1.jpg'); }
    .bg-slide-2 { background-image: url('background/pic05-2.jpg'); }
    .bg-slide-3 { background-image: url('background/pic05-3.jpg'); }

    @keyframes slideLoop {
      0% { transform: translateX(0); }
      100% { transform: translateX(-300vw); }
    }

    /* =========================================================
        5. STYLES SEGMEN 2: WELCOME / PEMBUKA SECTION
        ========================================================= */
    #section-welcome {
      position: relative;
      z-index: 5;
      width: 100vw;
      min-height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .welcome-content {
      position: relative;
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Teks Welcome to Our Wedding */
    .sec2-title {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.6s ease, transform 1.6s ease;
    }

    /* Nama Mempelai Foglihtenno07 dengan Gradient Animation */
    .sec2-names {
      font-family: 'Foglihtenno07', serif;
      font-size: 35px;
      letter-spacing: 2px;
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, #dcdcdc 50%, #8a8a8a 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: nameGradientMove 4s ease infinite;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.6s ease 0.3s, transform 1.6s ease 0.3s;
    }

    @keyframes nameGradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Teks Deskripsi Undangan */
    .sec2-desc {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 9px;
      line-height: 1.6;
      color: #f0f0f0;
      max-width: 320px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.6s ease 0.6s, transform 1.6s ease 0.6s;
    }

    /* Kotak Countdown Glassmorphism */
    .sec2-countdown {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.6s ease 0.9s, transform 1.6s ease 0.9s;
    }

    .countdown-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 52px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .countdown-number {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #4a3b32; /* Brown elegant */
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .countdown-label {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4a3b32; /* Brown elegant */
      margin-top: 2px;
    }

    /* Kelas aktif untuk memicu animasi saat dibuka */
    .animate-in .sec2-title,
    .animate-in .sec2-names,
    .animate-in .sec2-desc,
    .animate-in .sec2-countdown {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================
        6. AUDIO PLAYER KASET (ESTHETIC & FLOATING)
        ========================================================= */
    #audio-player-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9990;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #audio-player-container.hide-player {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    .cassette-player {
      width: 45px;
      height: 45px;
      background: rgba(40, 40, 40, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .cassette-inner {
      width: 33px;
      height: 33px;
      border: 2px dashed #b5b5b5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .playing-animation {
      animation: rotateVinyl 3s linear infinite;
    }

    @keyframes rotateVinyl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .cassette-center-dot {
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- ========================================== -->
    <!-- [SECTION 1: COVER / SAMPUL] -->
    <!-- ========================================== -->
    <section id="section-cover">
      <div class="cover-content">
        <div class="text-the-wedding">The Wedding of</div>
        <div class="text-mempelai">Arin & Dito</div>

        <div class="text-kepada">Kepada Yth.</div>
        <div class="text-tamu" id="nama-tamu">Tamu Undangan</div>
        <div class="text-maaf">Mohon maaf apabila ada kesalahan penulisan nama/gelar</div>

        <button class="btn-open" onclick="bukaUndangan()">
          <svg class="leaf-icon" viewBox="0 0 24 24">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c2.4 2 3 3.5 2.1 9.2A7 7 0 0 1 11 20z"></path>
            <path d="M2 21c0-3 1.8-5.2 5-6"></path>
          </svg>
          Buka Undangan
        </button>
      </div>
    </section>

    <!-- MAIN CONTENT (TERSEMBUNYI SEBELUM DIBUKA) -->
    <div id="main-content">
      <!-- SLIDER BACKGROUND FIXED -->
      <div class="bg-slider-container">
        <div class="bg-slider-track">
          <div class="bg-slide bg-slide-1"></div>
          <div class="bg-slide bg-slide-2"></div>
          <div class="bg-slide bg-slide-3"></div>
          <div class="bg-slide bg-slide-1"></div>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- [SECTION 2: WELCOME / PEMBUKA] -->
      <!-- ========================================== -->
      <section id="section-welcome">
        <div class="welcome-content" id="welcome-anim-box">
          <div class="sec2-title">WELCOME TO OUR WEDDING</div>
          <div class="sec2-names">Arin & Dito</div>
          <div class="sec2-desc">Together with our families, we joyfully invite you to share in our happiness as we celebrate our wedding.</div>
          
          <!-- Countdown Target: 12.12.2030 -->
          <div class="sec2-countdown">
            <div class="countdown-box">
              <div class="countdown-number" id="days">00</div>
              <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-box">
              <div class="countdown-number" id="hours">00</div>
              <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-box">
              <div class="countdown-number" id="minutes">00</div>
              <div class="countdown-label">Mins</div>
            </div>
            <div class="countdown-box">
              <div class="countdown-number" id="seconds">00</div>
              <div class="countdown-label">Secs</div>
            </div>
          </div>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- [SECTION 3: COUPLE / MEMPELAI SECTION] -->
      <!-- ========================================== -->
      <section id="section-couple" style="position: relative; z-index: 5; min-height: 100vh; padding: 60px 20px;">
        <!-- Kode Mempelai akan diletakkan di sini nanti -->
      </section>

      <!-- ========================================== -->
      <!-- [SECTION 4: EVENT / ACARA SECTION] -->
      <!-- ========================================== -->
      <section id="section-event" style="position: relative; z-index: 5; min-height: 100vh; padding: 60px 20px;">
        <!-- Kode Detail Acara akan diletakkan di sini nanti -->
      </section>

    </div>

  </div>

  <!-- AUDIO PLAYER KASET (POJOK KANAN BAWAH) -->
  <div id="audio-player-container">
    <div class="cassette-player" onclick="toggleAudio()" title="Play/Pause Music">
      <div class="cassette-inner playing-animation" id="cassette-icon">
        <div class="cassette-center-dot"></div>
      </div>
    </div>
  </div>
  
  <!-- Audio Element -->
  <audio id="wedding-audio" loop>
    <source src="https://files.catbox.moe/hva00z.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Ambil parameter nama tamu dari URL (contoh: ?to=Nama+Tamu)
    const urlParams = new URLSearchParams(window.location.search);
    const namaTamu = urlParams.get('to');
    if (namaTamu) {
      document.getElementById('nama-tamu').innerText = namaTamu;
    }

    const audio = document.getElementById('wedding-audio');
    const cassetteIcon = document.getElementById('cassette-icon');
    let isPlaying = false;

    // Fungsi untuk membuka undangan
    function bukaUndangan() {
      const cover = document.getElementById('section-cover');
      const mainContent = document.getElementById('main-content');
      const welcomeBox = document.getElementById('welcome-anim-box');

      // Tampilkan konten utama
      mainContent.style.display = 'block';
      
      // Jalankan animasi fade-out pada cover
      cover.classList.add('fade-out');

      // Trigger animasi masuk section 2
      setTimeout(() => {
        welcomeBox.classList.add('animate-in');
      }, 200);

      // Play audio otomatis
      audio.play().then(() => {
        isPlaying = true;
        cassetteIcon.classList.add('playing-animation');
      }).catch(err => {
        console.log("Autoplay diblokir browser:", err);
      });

      // Sembunyikan elemen cover sepenuhnya setelah animasi selesai
      setTimeout(() => {
        cover.style.display = 'none';
        window.scrollTo(0, 0);
      }, 800);
    }

    // Toggle Play/Pause Audio
    function toggleAudio() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        cassetteIcon.classList.remove('playing-animation');
      } else {
        audio.play();
        isPlaying = true;
        cassetteIcon.classList.add('playing-animation');
      }
    }

    // Efek Scroll: Muncul/Hilangkan pemutar musik dengan fade in-out saat digulir
    let lastScrollTop = 0;
    const playerContainer = document.getElementById('audio-player-container');

    window.addEventListener('scroll', function() {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      
      if (scrollTop > 50) {
        // Saat mulai digulir ke bawah, beri efek smooth fade out / sembunyi
        playerContainer.classList.add('hide-player');
      } else {
        // Kembali ke paling atas, munculkan kembali
        playerContainer.classList.remove('hide-player');
      }
      lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    }, false);

    // Countdown Timer Logic (Target: 12 Desember 2030)
    const targetDate = new Date("December 12, 2030 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = String(days).padStart(2, '0');
        document.getElementById("hours").innerText = String(hours).padStart(2, '0');
        document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
        document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
