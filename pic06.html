<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding of Revin & Agio</title>
  
  <!-- Import Font Lato -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,500;0,700;1,500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Kunci scroll sebelum undangan dibuka */
    body, html {
      height: 100%;
      font-family: 'Lato', sans-serif;
      overflow: hidden; /* Scroll dinonaktifkan secara default */
      background-color: #fdfbfb;
    }

    /* Class untuk mengaktifkan kembali scroll setelah dibuka */
    body.is-open, html.is-open {
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Layout Utama Split-Screen */
    .main-wrapper {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    /* KIRI: Sampul Diam/Fixed - Ukuran 60% (Desktop) */
    .left-side {
      width: 60%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background: url('background/pic06-sampulside.jpg?v=2') no-repeat center center/cover;
      z-index: 1;
    }

    /* KANAN: Sampul Scroll - Ukuran 40% (Desktop) */
    .right-side {
      width: 40%;
      margin-left: 60%;
      min-height: 100vh;
      position: relative;
      z-index: 2;
    }

    /* Section 1: Sampul Cover Layer */
    #cover-section {
      position: relative;
      width: 100%;
      height: 100vh; /* Penuh 1 layar */
      background: url('background/pic06-sampul.jpg?v=2') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      /* Animasi pergeseran ke atas secara perlahan dan elegant */
      transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.5s ease;
      z-index: 10;
    }

    /* Class untuk menggeser sampul ke atas */
    #cover-section.slide-up {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Styling Teks Sampul */
    .text-title {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: #000000;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .img-names {
      height: 140px;
      width: auto;
      object-fit: contain;
      margin-bottom: 100px;
    }

    .text-to {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: #000000;
      margin-bottom: 8px;
    }

    .guest-name {
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 19px;
      color: #000000;
      margin-bottom: 12px;
      text-transform: capitalize;
    }

    .text-apology {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      font-style: italic;
      font-size: 9px;
      color: #000000;
      max-width: 80%;
      line-height: 1.4;
      margin-bottom: 35px;
    }

    /* Tombol Buka Undangan dengan Animasi Pastel Soft & Amplop */
    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #e6e0fa, #f3effe, #e8f0fe);
      background-size: 200% 200%;
      color: #4a3e56;
      border: 1px solid #d3c5f5;
      padding: 10px 22px;
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(177, 159, 251, 0.2);
      animation: pastelGradient 6s ease infinite;
      transition: all 0.3s ease;
    }

    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(177, 159, 251, 0.35);
    }

    @keyframes pastelGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Animasi Ikon Amplop Terbuka di Dalam Tombol */
    .envelope-icon {
      width: 16px;
      height: 14px;
      position: relative;
    }

    .envelope-flap {
      transform-origin: top;
      transition: transform 0.4s ease;
    }

    .btn-open:hover .envelope-flap {
      transform: rotateX(180deg);
    }

    /* ANIMASI COME IN SANGAT LAMBAT */
    .slow-come-in {
      opacity: 0;
      transform: translateY(25px);
      animation: comeInSlow 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Delay bertahap */
    .delay-1 { animation-delay: 0.3s; }
    .delay-2 { animation-delay: 0.8s; }
    .delay-3 { animation-delay: 1.3s; }
    .delay-4 { animation-delay: 1.8s; }
    .delay-5 { animation-delay: 2.3s; }
    .delay-6 { animation-delay: 2.8s; }

    @keyframes comeInSlow {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Isi Undangan Utama */
    .main-content {
      padding: 60px 20px;
      min-height: 100vh;
      background-color: #ffffff;
      text-align: center;
    }

    /* RESPONSIVE: MOBILE VIEW */
    @media (max-width: 768px) {
      .left-side {
        display: none; /* Sembunyikan bagian kiri di mobile */
      }
      .right-side {
        width: 100%;
        margin-left: 0;
      }
      /* Latar belakang sampul di mobile memenuhi penuh 1 layar penuh tanpa terpotong */
      #cover-section {
        height: 100vh;
        width: 100vw;
        background-size: cover;
        background-position: center center;
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- SISI KIRI (Fixed / Diam - Desktop Only) -->
    <div class="left-side"></div>

    <!-- SISI KANAN (Active Scroll) -->
    <div class="right-side">
      
      <!-- SECTION 1: SAMPUL COVER -->
      <section id="cover-section">
        
        <!-- Tulisan THE WEDDING OF -->
        <div class="text-title slow-come-in delay-1">THE WEDDING OF</div>
        
        <!-- Gambar Nama Pasangan -->
        <img src="photo/revinagio.png?v=2" alt="Revin & Agio" class="img-names slow-come-in delay-2">
        
        <!-- Kepada Yth -->
        <div class="text-to slow-come-in delay-3">Kepada Yth</div>
        
        <!-- Nama Tamu Undangan (?to=) -->
        <div id="guest-name" class="guest-name slow-come-in delay-4">Tamu Undangan</div>
        
        <!-- Teks Permohonan Maaf -->
        <div class="text-apology slow-come-in delay-5">
          Mohon maaf apabila ada kesalahan dalam penulisan nama atau gelar
        </div>
        
        <!-- Tombol Buka Undangan dengan Ikon Amplop Animasi -->
        <div class="slow-come-in delay-6">
          <button class="btn-open" onclick="openInvitation()">
            <!-- SVG Ikon Amplop Interaktif -->
            <svg class="envelope-icon" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="3" width="22" height="14" rx="2" stroke="#4a3e56" stroke-width="1.8" fill="#ffffff"/>
              <path class="envelope-flap" d="M2 3L12 11L22 3" stroke="#4a3e56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Buka Undangan</span>
          </button>
        </div>

      </section>

      <!-- SECTION 2: KONTEN UTAMA UNDANGAN -->
      <main class="main-content">
        <h2>Acara Pernikahan</h2>
        <p style="margin-top: 20px; color: #666; font-size: 14px;">
          Selamat datang di halaman utama undangan kami...
        </p>
      </main>

    </div>
  </div>

  <script>
    // 1. Ambil parameter nama tamu dari URL (?to=)
    function getGuestName() {
      const urlParams = new URLSearchParams(window.location.search);
      const guestName = urlParams.get('to');
      if (guestName) {
        document.getElementById('guest-name').innerText = decodeURIComponent(guestName);
      }
    }

    // 2. Fungsi Buka Undangan & Mengaktifkan Scroll
    function openInvitation() {
      const cover = document.getElementById('cover-section');
      
      // Menggeser sampul ke atas
      cover.classList.add('slide-up');

      // Membuka kunci scroll halaman
      document.documentElement.classList.add('is-open');
      document.body.classList.add('is-open');

      setTimeout(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', getGuestName);
  </script>

</body>
</html>
