<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>

    <!-- Google Fonts: Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container utama section sampul */
        .cover-section {
            position: relative;
            width: 100%;
            max-width: 480px; /* Ukuran tampilan mobile agar lebih proporsional */
            min-height: 100vh;
            background: url('background/pic06.jpg') no-repeat center center / cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px;
            overflow: hidden;
        }

        /* Overlay gelap halus agar teks dan gambar lebih jelas di atas background */
        .cover-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .cover-content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header: THE WEDDING OF */
        .wedding-of {
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 900; /* Black */
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 15px;
        }

        /* Gambar revinagio.png */
        .title-img {
            height: 35px;
            width: auto;
            margin-bottom: 25px;
            object-fit: contain;
        }

        /* Kepada Yth. */
        .kepada-yth {
            font-size: 13px;
            font-weight: 400;
            color: #e0e0e0;
            margin-bottom: 8px;
        }

        /* Nama Tamu Undangan (dinamis via parameter URL) */
        .guest-name {
            font-size: 17px;
            font-weight: 700; /* Bold */
            color: #ffffff;
            margin-bottom: 6px;
            word-wrap: break-word;
        }

        /* Disclaimer Kesalahan Nama/Gelar */
        .disclaimer {
            font-family: 'Lato', sans-serif;
            font-style: italic;
            font-size: 8px;
            color: #d1d1d1;
            margin-bottom: 30px;
            max-width: 80%;
            line-height: 1.3;
        }

        /* Style Tombol Open Invitation */
        .btn-open {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 28px;
            background: rgba(106, 27, 154, 0.65); /* Tema Ungu Classy Transparent */
            border: 1px solid rgba(216, 180, 254, 0.8);
            border-radius: 30px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(106, 27, 154, 0.4);
            transition: all 0.4s ease;
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        /* Style Icon Bunga Lavender Minimalis */
        .lavender-icon {
            width: 18px;
            height: 18px;
            stroke: #e9d5ff;
            stroke-width: 1.5;
            fill: none;
            transition: transform 0.4s ease;
        }

        /* Efek Hover Tombol yang Elegan */
        .btn-open:hover {
            background: rgba(147, 51, 234, 0.9);
            border-color: #ffffff;
            box-shadow: 0 6px 22px rgba(168, 85, 247, 0.7);
            transform: translateY(-2px);
        }

        .btn-open:hover .lavender-icon {
            transform: rotate(-12deg) scale(1.1);
        }

        /* Animasi Glow dan Pulse Classy Elegant */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 10px rgba(147, 51, 234, 0.4);
            }
            50% {
                box-shadow: 0 0 20px rgba(192, 132, 252, 0.8);
            }
            100% {
                box-shadow: 0 0 10px rgba(147, 51, 234, 0.4);
            }
        }
    </style>
</head>
<body>

    <!-- Section 1 (Sampul) -->
    <section class="cover-section">
        <div class="cover-content">
            <!-- Header -->
            <div class="wedding-of">THE WEDDING OF</div>

            <!-- Gambar Nama Pasangan -->
            <img src="photo/revinagio.png" alt="Revina & Gio" class="title-img">

            <!-- Kepada Yth. -->
            <div class="kepada-yth">Kepada Yth.</div>

            <!-- Nama Tamu dari Parameter ?to= -->
            <div class="guest-name" id="guestName">Tamu Undangan</div>

            <!-- Disclaimer -->
            <div class="disclaimer">*mohon maaf apabila ada kesalahan dalam penulisan nama atau gelar</div>

            <!-- Tombol Open Invitation -->
            <button class="btn-open" onclick="openInvitation()">
                <!-- SVG Icon Bunga Lavender Minimalis -->
                <svg class="lavender-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <!-- Batang & Daun -->
                    <path d="M12 22V10" stroke-linecap="round"/>
                    <path d="M12 18C10 17 9 15 9 15" stroke-linecap="round"/>
                    <path d="M12 16C14 15 15 13 15 13" stroke-linecap="round"/>
                    <!-- Kelopak Bunga Lavender Line Minimalist -->
                    <circle cx="12" cy="9" r="1.5" fill="#e9d5ff" stroke="none"/>
                    <circle cx="10" cy="7" r="1.5" fill="#d8b4fe" stroke="none"/>
                    <circle cx="14" cy="7" r="1.5" fill="#d8b4fe" stroke="none"/>
                    <circle cx="12" cy="5" r="1.2" fill="#c084fc" stroke="none"/>
                    <circle cx="10.5" cy="3.5" r="1.2" fill="#a855f7" stroke="none"/>
                    <circle cx="13.5" cy="3.5" r="1.2" fill="#a855f7" stroke="none"/>
                    <circle cx="12" cy="2" r="1" fill="#9333ea" stroke="none"/>
                </svg>
                <span>Open Invitation</span>
            </button>
        </div>
    </section>

    <!-- JavaScript untuk Membaca Parameter URL ?to= -->
    <script>
        // Mengambil parameter 'to' dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const guestParam = urlParams.get('to');

        // Jika parameter 'to' ada di URL, ubah teks Tamu Undangan
        if (guestParam) {
            document.getElementById('guestName').innerText = guestParam;
        }

        // Fungsi tombol buka undangan
        function openInvitation() {
            alert("Membuka Undangan...");
            // Anda bisa menambahkan scroll smooth ke section berikutnya di sini
        }
    </script>
</body>
</html>
